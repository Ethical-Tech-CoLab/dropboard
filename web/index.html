<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DropBoard 🗂️</title>
  <meta name="description" content="A shared drop-space in your browser. Drop files, links, and text onto a board everyone in your session can grab." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗂️</text></svg>" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="wrap">
    <header>
      <h1>DropBoard <span aria-hidden="true">🗂️</span></h1>
      <p class="tagline">A shared drop-space in your browser. No accounts, no installs.</p>
    </header>

    <!-- Landing: create or join -->
    <section id="landing" class="card">
      <button id="createBtn" class="primary big">Start a board</button>
      <p class="or">or join with a code</p>
      <div class="row">
        <input id="joinCode" placeholder="e.g. TIGER-4821" autocomplete="off" spellcheck="false" />
        <button id="joinBtn">Join</button>
      </div>
    </section>

    <!-- Board -->
    <section id="board" class="card" hidden>
      <div class="board-head">
        <div>
          <span class="muted">Board code</span>
          <strong id="codeLabel" class="code"></strong>
          <button id="copyCode" class="link">copy</button>
        </div>
        <div class="board-actions">
          <button id="endBtn" class="danger" hidden>End session</button>
          <button id="leaveBtn" class="link">Leave</button>
        </div>
      </div>

      <div class="composer-row">
        <input id="composer" placeholder="Type a note or paste a link…  (⌘/Ctrl+Enter)" autocomplete="off" />
        <button id="dropBtn" class="primary">Drop</button>
        <label class="file-btn">📎<input id="fileInput" type="file" multiple hidden /></label>
      </div>
      <p class="hint">Drag files anywhere onto the board, or paste from the clipboard.</p>

      <ul id="items" class="items"></ul>
    </section>

    <footer>
      <p>docs/PRODUCT_DESIGN.md · docs/BACKEND_OPTIONS.md · <a href="https://github.com/alx-du/dropboard">repo</a></p>
    </footer>
  </main>

  <div id="toast" class="toast" hidden></div>

  <script src="./config.js"></script>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
