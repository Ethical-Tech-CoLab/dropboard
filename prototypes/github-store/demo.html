<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DropBoard — GitHub-store prototype</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.3rem; }
    .warn { background: #fff4e5; border: 1px solid #ffcf99; padding: .75rem 1rem; border-radius: 8px; font-size: .9rem; }
    input, button, select { font: inherit; padding: .4rem .6rem; }
    .row { display: flex; gap: .5rem; margin: .5rem 0; flex-wrap: wrap; }
    ul { list-style: none; padding: 0; }
    li { border: 1px solid #ddd; border-radius: 8px; padding: .5rem .7rem; margin: .35rem 0; }
    code { background: #f0f0f0; padding: .1rem .3rem; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>DropBoard — GitHub-store prototype</h1>
  <p class="warn">⚠️ Proof of concept only. Text/links only, no real-time (polls every 3s), and
    content persists in gist history — <strong>not ephemeral, not private</strong>. See
    <code>README.md</code>.</p>

  <div class="row">
    <button id="create">Create board</button>
    <input id="boardId" placeholder="or paste a board id" size="26" />
    <button id="open">Open</button>
  </div>

  <div id="board" hidden>
    <p>Board: <code id="curId"></code></p>
    <div class="row">
      <select id="kind"><option value="text">text</option><option value="link">link</option></select>
      <input id="value" placeholder="type text or paste a URL" size="34" />
      <button id="add">Drop</button>
    </div>
    <ul id="items"></ul>
  </div>

  <script>
    const BASE = "http://localhost:8799";
    let boardId = null, timer = null;

    async function api(path, opts) {
      const res = await fetch(BASE + path, opts);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || res.status);
      return data;
    }
    function render(items) {
      document.getElementById("items").innerHTML = (items || []).map((it) =>
        it.kind === "link"
          ? `<li>🔗 <a href="${it.content.url || it.content}" target="_blank" rel="noopener noreferrer">${it.content.url || it.content}</a></li>`
          : `<li>📝 ${String(it.content.text || it.content).replace(/[<>&]/g, (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]))}</li>`
      ).join("");
    }
    async function refresh() {
      if (!boardId) return;
      try { render((await api(`/board/${boardId}`)).items); } catch (e) { console.warn(e); }
    }
    function openBoard(id) {
      boardId = id;
      document.getElementById("curId").textContent = id;
      document.getElementById("board").hidden = false;
      clearInterval(timer); timer = setInterval(refresh, 3000); refresh();
    }
    document.getElementById("create").onclick = async () => openBoard((await api("/board", { method: "POST" })).board_id);
    document.getElementById("open").onclick = () => { const v = document.getElementById("boardId").value.trim(); if (v) openBoard(v); };
    document.getElementById("add").onclick = async () => {
      const kind = document.getElementById("kind").value;
      const raw = document.getElementById("value").value.trim();
      if (!raw) return;
      const content = kind === "link" ? { url: raw } : { text: raw };
      await api(`/board/${boardId}/items`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ kind, content }) });
      document.getElementById("value").value = ""; refresh();
    };
  </script>
</body>
</html>
